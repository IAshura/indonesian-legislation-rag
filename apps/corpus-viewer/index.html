<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Units Viewer — Korpus Norma Indonesia</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#12161f; --panel2:#171c28; --border:#232a38;
    --text:#dbe2ee; --dim:#8b94a7; --accent:#5ec8b2; --accent2:#6ea8fe;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --neutral:#8b949e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    padding:14px 20px; border-bottom:1px solid var(--border); background:var(--panel);
    display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
  }
  header h1{font-size:16px; font-weight:600; letter-spacing:.3px}
  header h1 span{color:var(--accent)}
  #status{color:var(--dim); font-size:12.5px}
  #status b{color:var(--text); font-weight:600}
  .pick{margin-left:auto}
  .pick label{
    font-size:12.5px; color:var(--accent2); cursor:pointer;
    border:1px dashed var(--border); padding:5px 10px; border-radius:6px;
  }
  .pick label:hover{border-color:var(--accent2)}
  .pick input{display:none}

  .toolbar{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    padding:10px 20px; border-bottom:1px solid var(--border); background:var(--panel);
  }
  .toolbar input[type=search],.toolbar input[type=number],.toolbar select{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 9px; font-size:13px; outline:none;
  }
  .toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
  .toolbar input[type=search]{flex:1; min-width:200px}
  .toolbar input[type=number]{width:86px}
  .toolbar .lbl{color:var(--dim); font-size:12px}
  #reset{
    background:none; border:1px solid var(--border); color:var(--dim);
    border-radius:6px; padding:6px 10px; cursor:pointer; font-size:12.5px;
  }
  #reset:hover{color:var(--text); border-color:var(--dim)}
  #count{color:var(--dim); font-size:12.5px; margin-left:auto}

  main{flex:1; overflow:auto; padding:0 20px}
  table{width:max-content; min-width:100%; border-collapse:collapse; font-size:13px}
  th:first-child,td:first-child{position:sticky; left:0}
  thead th:first-child{z-index:4; background:var(--panel)}
  tbody td:first-child{background:var(--bg); z-index:1; border-right:1px solid var(--border)}
  thead th{
    position:sticky; top:0; z-index:2; background:var(--panel);
    text-align:left; padding:8px 10px; border-bottom:1px solid var(--border);
    font-size:11.5px; letter-spacing:.5px; color:var(--dim);
    white-space:nowrap; user-select:none; cursor:pointer;
  }
  thead th:hover{color:var(--text)}
  thead th .en{display:block; text-transform:lowercase; font-family:ui-monospace,Consolas,monospace; font-size:11px; color:var(--text)}
  thead th .idn{display:block; font-size:10.5px; letter-spacing:.2px; color:var(--dim); font-weight:400}
  thead th.sorted .en,thead th.sorted{color:var(--accent)}
  thead th .arr{color:var(--accent); font-size:10px}
  tbody td{
    padding:7px 10px; border-bottom:1px solid #161b26; vertical-align:top;
    white-space:nowrap;
  }
  tbody tr:hover{background:#141a26; cursor:pointer}
  tbody tr:hover td:first-child{background:#141a26}
  td .clip{
    display:inline-block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    max-width:34ch; vertical-align:bottom; color:#b9c2d0;
  }
  .num{text-align:right; font-variant-numeric:tabular-nums; color:var(--dim)}
  .tag{
    display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px;
    border:1px solid var(--border); color:var(--dim);
  }
  .tag.body{color:var(--accent2)} .tag.bab{color:var(--warn)}
  .tag.paragraf{color:var(--neutral)} .tag.pasal{color:var(--accent)}
  .q-ok{color:var(--ok)} .q-structural_heading{color:var(--warn)}
  .q-structural_admin{color:var(--neutral)} .q-needs_review_short{color:var(--bad)}

  footer{
    display:flex; align-items:center; gap:10px; padding:10px 20px;
    border-top:1px solid var(--border); background:var(--panel); font-size:12.5px; color:var(--dim);
  }
  footer button{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 12px; cursor:pointer; font-size:12.5px;
  }
  footer button:disabled{opacity:.35; cursor:default}
  footer select{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 8px; font-size:12.5px;
  }

  #empty{padding:60px 20px; text-align:center; color:var(--dim)}
  #empty code{background:var(--panel2); padding:2px 6px; border-radius:4px; color:var(--accent)}
  #empty .hint{margin-top:10px; font-size:12.5px}

  #modal{
    position:fixed; inset:0; background:rgba(4,6,10,.72); display:none;
    align-items:flex-start; justify-content:center; z-index:10; padding:32px 30px 72px;
  }
  #modal.open{display:flex}
  #modal .card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    width:min(1200px,100%); max-height:calc(100vh - 104px); overflow:hidden;
    display:flex; flex-direction:column; padding:22px 26px 40px;
  }
  #modal h2{font-size:14px; margin-bottom:16px; color:var(--accent); flex:none}
  #modal .split{
    display:grid; grid-template-columns:minmax(280px,430px) 1fr; gap:26px;
    flex:1; min-height:0; overflow:hidden;
  }
  #modal dl{
    display:grid; grid-template-columns:126px 1fr; gap:6px 14px; font-size:13px;
    align-content:start; overflow-y:auto; min-height:0; padding-right:4px;
  }
  #modal dt{color:var(--dim)}
  #modal dt code{display:block; font-size:10.5px; color:#5b6472; font-family:ui-monospace,Consolas,monospace}
  #modal dd{overflow-wrap:anywhere; font-variant-numeric:tabular-nums}
  #modal .texts{
    display:flex; flex-direction:column; gap:16px; border-left:1px solid var(--border);
    padding-left:26px; min-width:0; min-height:0; overflow-y:auto;
  }
  #modal .texts .tl{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim)}
  #modal .texts .tl code{font-size:10px; text-transform:lowercase; letter-spacing:0; color:#5b6472; margin-left:6px}
  #modal pre{
    background:var(--panel2); border:1px solid var(--border); border-radius:6px;
    padding:14px; white-space:pre-wrap; overflow-wrap:anywhere;
    font-family:ui-monospace,Consolas,monospace; font-size:13px; line-height:1.6;
  }
  @media (max-width:900px){
    #modal .card{display:block; overflow:auto}
    #modal .split{display:block; overflow:visible}
    #modal dl,#modal .texts{overflow:visible}
    #modal .texts{border-left:none; padding-left:0; border-top:1px solid var(--border); padding-top:16px; margin-top:16px}
  }
</style>
</head>
<body>

<header>
  <h1>units<span>.csv</span> · viewer</h1>
  <div id="status">Memuat units.csv…</div>
  <div class="pick"><input type="file" id="filepick" accept=".csv"><label for="filepick">pilih units.csv</label></div>
</header>

<section class="toolbar" id="toolbar" style="display:none">
  <input type="search" id="q" placeholder="Cari teks / dokumen…">
  <select id="fdt"></select>
  <select id="fut"></select>
  <select id="fq"></select>
  <span class="lbl">tahun</span>
  <input type="number" id="y0" placeholder="dari" min="1900" max="2030">
  <input type="number" id="y1" placeholder="sampai" min="1900" max="2030">
  <button id="reset">reset</button>
  <span id="count"></span>
</section>

<main>
  <table id="tbl" style="display:none">
    <thead><tr id="thead"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty">
    <p>Belum ada data.</p>
    <p class="hint">Jalankan dari folder ini lewat server lokal: <code>python -m http.server 8000</code> lalu buka <code>http://localhost:8000/</code> — atau klik <b>pilih units.csv</b> di kanan atas bila membuka file ini langsung.</p>
  </div>
</main>

<footer id="pager" style="display:none">
  <button id="first">«</button>
  <button id="prev">‹ prev</button>
  <span id="pginfo"></span>
  <button id="next">next ›</button>
  <button id="last">»</button>
  <span style="margin-left:auto">baris/hal</span>
  <select id="psize">
    <option>25</option><option selected>50</option><option>100</option><option>200</option>
  </select>
</footer>

<div id="modal"><div class="card" id="card"></div></div>

<script>
"use strict";
const nf = new Intl.NumberFormat("id-ID");
const $ = id => document.getElementById(id);

const COLS = ["unit_id","document_name","relative_path","doc_type","hierarchy_level","year",
  "page_number","line_start","line_end","unit_type","bab_marker","paragraf_marker",
  "pasal_marker","ayat_marker","text_original","text_normalized",
  "indobert_token_count","indobert_unk_count","indobert_unk_ratio","quality_flag"];
let C = {}; COLS.forEach((c,i)=>C[c]=i);

const LBL = {
  unit_id:"ID unit", document_name:"nama dokumen", relative_path:"jalur berkas sumber",
  doc_type:"jenis peraturan", hierarchy_level:"tingkat hierarki", year:"tahun",
  page_number:"nomor halaman", line_start:"baris awal", line_end:"baris akhir",
  unit_type:"tipe unit", bab_marker:"penanda BAB", paragraf_marker:"penanda Paragraf",
  pasal_marker:"penanda Pasal", ayat_marker:"penanda ayat",
  text_original:"teks asli", text_normalized:"teks ternormalisasi",
  indobert_token_count:"jumlah token IndoBERT", indobert_unk_count:"jumlah token UNK",
  indobert_unk_ratio:"rasio UNK", quality_flag:"penanda mutu"
};

const NUMCOLS = ["unit_id","hierarchy_level","year","page_number","line_start","line_end",
  "ayat_marker","indobert_token_count","indobert_unk_count","indobert_unk_ratio"];
const W = {document_name:26, relative_path:24, paragraf_marker:20, text_original:52, text_normalized:52};
const TABLE = COLS.map(k=>({k, num:NUMCOLS.includes(k), w:W[k]||0}));

// ---- CSV parser (menangani kutip, koma, newline dalam kutip, CRLF) ----
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[]; let row=[], field="", i=0, n=text.length, inQ=false;
  while(i<n){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){
        if(text[i+1]==='"'){field+='"';i+=2;continue}
        inQ=false;i++;continue;
      }
      field+=ch;i++;continue;
    }
    if(ch==='"'){inQ=true;i++;continue}
    if(ch===','){row.push(field);field="";i++;continue}
    if(ch==='\r'){if(text[i+1]==='\n')i++;row.push(field);rows.push(row);row=[];field="";i++;continue}
    if(ch==='\n'){row.push(field);rows.push(row);row=[];field="";i++;continue}
    field+=ch;i++;
  }
  if(field.length||row.length){row.push(field);rows.push(row)}
  return rows;
}

let ALL=[];          // array of raw string arrays
let view=[];         // indices into ALL after filter
let page=1, psize=50;
let sortKey=null, sortDir=-1;
let lowerCache=null;

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function ingest(text){
  const rows=parseCSV(text);
  if(!rows.length) throw new Error("file kosong");
  const header=rows[0].map(h=>h.trim());
  header.forEach((h,i)=>{if(C[h]!==undefined && C[h]!==i) C[h]=i});
  ALL=rows.slice(1).filter(r=>r.length===header.length);
  lowerCache=null;
  const docs=new Set(ALL.map(r=>r[C.document_name])).size;
  $("status").innerHTML="<b>"+nf.format(ALL.length)+"</b> unit · <b>"+nf.format(docs)+"</b> dokumen · klik baris untuk detail";
  buildFilters();
  $("toolbar").style.display="";
  $("empty").style.display="none";
  $("tbl").style.display="";
  $("pager").style.display="";
  applyFilters();
  if(new URLSearchParams(location.search).has("open")&&view.length) showDetail(view[0]);
}

function buildFilters(){
  buildSelect($("fdt"), C.doc_type, "semua jenis", true);
  buildSelect($("fut"), C.unit_type, "semua tipe", true);
  buildSelect($("fq"), C.quality_flag, "semua mutu", false);
}
function buildSelect(sel, idx, allLabel, sortByCount){
  const m=new Map();
  for(const r of ALL) m.set(r[idx],(m.get(r[idx])||0)+1);
  let ent=[...m.entries()];
  if(sortByCount) ent.sort((a,b)=>b[1]-a[1]); else ent.sort();
  sel.innerHTML="<option value=''>"+allLabel+"</option>"+
    ent.map(([k,c])=>`<option value="${esc(k)}">${esc(k)} (${nf.format(c)})</option>`).join("");
}

function lower(){
  if(!lowerCache) lowerCache=ALL.map(r=>(r[C.document_name]+" "+r[C.text_original]).toLowerCase());
  return lowerCache;
}

function applyFilters(){
  const q=$("q").value.trim().toLowerCase();
  const dt=$("fdt").value, ut=$("fut").value, qf=$("fq").value;
  const y0=parseInt($("y0").value)||0, y1=parseInt($("y1").value)||9999;
  const lc=q.length>=2?lower():null;
  view=[];
  for(let i=0;i<ALL.length;i++){
    const r=ALL[i];
    if(dt&&r[C.doc_type]!==dt)continue;
    if(ut&&r[C.unit_type]!==ut)continue;
    if(qf&&r[C.quality_flag]!==qf)continue;
    const y=+r[C.year];
    if(y<y0||y>y1)continue;
    if(lc&&!lc[i].includes(q))continue;
    view.push(i);
  }
  if(sortKey){
    const ci=C[sortKey];
    const numeric=TABLE.find(t=>t.k===sortKey)?.num;
    view.sort(numeric
      ?(a,b)=>(+ALL[a][ci])-(+ALL[b][ci])
      :(a,b)=>String(ALL[a][ci]).localeCompare(String(ALL[b][ci])));
    if(sortDir===1)view.reverse();
  }
  page=Math.min(page,Math.max(1,Math.ceil(view.length/psize)));
  $("count").textContent="ditampilkan "+nf.format(view.length)+" dari "+nf.format(ALL.length);
  render();
}

const typeClass=t=>t==="body"?"body":t==="heading_bab"?"bab":t==="heading_paragraf"?"paragraf":t==="heading_pasal"?"pasal":"";

function renderHead(){
  $("thead").innerHTML=TABLE.map(t=>{
    const s=sortKey===t.k;
    const arrow=s?(sortDir===-1?" ▼":" ▲"):" ⇅";
    return `<th data-k="${t.k}"${s?' class="sorted"':""}><span class="en">${t.k}</span><span class="idn">${LBL[t.k]}</span><span class="arr">${arrow}</span></th>`;
  }).join("");
  $("thead").querySelectorAll("th").forEach(th=>{
    th.onclick=()=>{
      const k=th.dataset.k;
      if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1}
      applyFilters();
    };
  });
}

function render(){
  renderHead();
  const start=(page-1)*psize;
  const slice=view.slice(start,start+psize);
  $("tbody").innerHTML=slice.map(i=>{
    const r=ALL[i];
    return `<tr data-i="${i}">`+TABLE.map(t=>{
      let v=r[C[t.k]];
      if(t.k==="unit_type")return `<td><span class="tag ${typeClass(v)}">${esc(v)}</span></td>`;
      if(t.k==="quality_flag")return `<td class="q-${esc(v)}">${esc(v.replace(/_/g," "))}</td>`;
      if(t.num&&t.k!=="unit_id")return `<td class="num">${esc(v)}</td>`;
      if(t.w)return `<td><span class="clip" style="max-width:${t.w}ch" title="${esc(v)}">${esc(v)}</span></td>`;
      return `<td>${esc(v)}</td>`;
    }).join("")+"</tr>";
  }).join("");
  $("tbody").querySelectorAll("tr").forEach(tr=>tr.onclick=()=>showDetail(+tr.dataset.i));
  const pages=Math.max(1,Math.ceil(view.length/psize));
  $("pginfo").textContent=`hal ${nf.format(page)} / ${nf.format(pages)}`;
  $("first").disabled=$("prev").disabled=page<=1;
  $("next").disabled=$("last").disabled=page>=pages;
}

const ALLCOLS=COLS;
function showDetail(i){
  const r=ALL[i];
  const meta=ALLCOLS.filter(c=>c!=="text_original"&&c!=="text_normalized");
  const dt=(c)=>`<dt>${LBL[c]}<code>${c}</code></dt>`;
  $("card").innerHTML="<h2>Unit "+esc(r[C.unit_id])+" · "+esc(r[C.document_name])+"</h2>"+
    '<div class="split">'+
    "<dl>"+meta.map(c=>dt(c)+`<dd>${esc(r[C[c]]||"—")}</dd>`).join("")+"</dl>"+
    '<div class="texts">'+
    `<div><div class="tl">Teks Asli<code>text_original</code></div><pre>${esc(r[C.text_original])}</pre></div>`+
    `<div><div class="tl">Teks Ternormalisasi<code>text_normalized</code></div><pre>${esc(r[C.text_normalized])}</pre></div>`+
    "</div></div>";
  $("modal").classList.add("open");
}
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.remove("open")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("modal").classList.remove("open")});

let deb=null;
$("q").addEventListener("input",()=>{clearTimeout(deb);deb=setTimeout(()=>{page=1;applyFilters()},200)});
["fdt","fut","fq","y0","y1"].forEach(id=>$(id).addEventListener("change",()=>{page=1;applyFilters()}));
$("reset").onclick=()=>{
  $("q").value="";["fdt","fut","fq","y0","y1"].forEach(id=>$(id).value="");
  sortKey=null;page=1;applyFilters();
};
$("psize").onchange=()=>{psize=+$("psize").value;page=1;render()};
$("first").onclick=()=>{page=1;render()};
$("prev").onclick=()=>{page--;render()};
$("next").onclick=()=>{page++;render()};
$("last").onclick=()=>{page=Math.max(1,Math.ceil(view.length/psize));render()};

$("filepick").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  $("status").textContent="Membaca "+f.name+"…";
  const fr=new FileReader();
  fr.onload=()=>{try{ingest(fr.result)}catch(err){$("status").textContent="Gagal: "+err.message}};
  fr.readAsText(f,"utf-8");
});

if(location.protocol==="file:"){
  $("status").innerHTML='Klik <b>pilih units.csv</b> untuk memuat berkas.';
}else{
    fetch("data/corpus/units.csv").then(r=>{
    if(!r.ok)throw new Error("HTTP "+r.status);
    $("status").textContent="Mengunduh units.csv…";
    return r.text();
  }).then(ingest).catch(()=>{
    $("status").innerHTML='units.csv tidak otomatis tersedia — klik <b>pilih units.csv</b>.';
  });
}
</script>
</body>
</html>
